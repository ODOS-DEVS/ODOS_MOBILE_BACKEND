# Maps the Upgrade header to the right Connection value.
#
# Loaded first (00- prefix) because odos.conf references $connection_upgrade and nginx resolves
# map directives at config-parse time. A plain `Connection: upgrade` on every request would
# break keepalive for ordinary HTTP; this sends `upgrade` only when the client asked for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
