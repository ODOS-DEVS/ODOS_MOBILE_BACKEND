upstream odos_api {
    # `api` is the Compose service name. Docker's embedded DNS resolves it, and scaling the
    # service (`docker compose up --scale api=3`) makes this round-robin across the replicas
    # with no config change.
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # --- Forwarded headers -------------------------------------------------
    #
    # X-Forwarded-For is set with $remote_addr (OVERWRITE), not $proxy_add_x_forwarded_for
    # (APPEND), and that difference matters.
    #
    # The append form takes whatever the client sent and adds the real address after it. The
    # application reads the LEFTMOST entry to identify the caller, so with the append form a
    # client can send `X-Forwarded-For: 1.2.3.4` and be identified as 1.2.3.4 — which defeats
    # the per-IP rate limits on login, signup, password reset and OTP send/verify by simply
    # rotating the header.
    #
    # Overwriting discards the client's claim entirely. nginx is the only hop here, so
    # $remote_addr IS the real peer.
    #
    # NOTE: if you ever put a CDN or load balancer in FRONT of this nginx, $remote_addr becomes
    # that device and this line must change — otherwise every request is attributed to the CDN.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;

    # --- WebSocket support -------------------------------------------------
    # /api/ws carries the realtime order and dashboard updates; without these the upgrade
    # handshake fails and the mobile app silently falls back to polling.
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # --- Timeouts ----------------------------------------------------------
    # Reads are generous because a WebSocket connection is idle most of the time. Connect stays
    # short: a slow connect means the API is down, and failing fast is better than queueing.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Baseline hardening. The API sets none of these itself today.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        DENY     always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://odos_api;
    }

    # Locally-stored media. Served by nginx rather than proxied so uvicorn workers are not tied
    # up streaming files. `nosniff` matters here specifically: these are user-uploaded.
    location /uploads/ {
        proxy_pass http://odos_api;
        proxy_cache_valid 200 1h;
        add_header X-Content-Type-Options nosniff always;
    }

    # Excluded from the access log — an uptime check every few seconds otherwise drowns out the
    # requests worth reading.
    location = /api/health {
        proxy_pass http://odos_api;
        access_log off;
    }
}
