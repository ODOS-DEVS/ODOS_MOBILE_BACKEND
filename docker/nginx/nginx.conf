# Nginx reverse proxy for the ODOS backend.
#
# Deliberately minimal: it terminates client connections, buffers slow ones, caps request size,
# compresses responses and forwards to uvicorn. It does NOT terminate TLS here — see conf.d/.

user  nginx;
# One worker per core.
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $upstream_response_time is what tells you whether a slow request was slow in the app or
    # slow in the proxy — worth the extra characters in every line.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Do not advertise the exact nginx version in responses and error pages.
    server_tokens   off;

    # Product images are the large payloads here. 20MB is above the app's own 15MB document cap
    # so the app returns its own friendly error rather than nginx cutting the connection.
    client_max_body_size 20m;

    # A client that opens a connection and dribbles bytes ties up a worker. These cap that.
    client_body_timeout   30s;
    client_header_timeout 30s;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        application/json application/javascript text/css text/plain text/xml;

    include /etc/nginx/conf.d/*.conf;
}
