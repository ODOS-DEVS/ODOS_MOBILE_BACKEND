services:
  - type: web
    name: odos-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/render_start.sh
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,https://odos-admin.onrender.com
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_NAME
        value: ODOS
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_VERIFICATION_CODE_EXPIRE_MINUTES
        value: "10"
      - key: PASSWORD_RESET_CODE_EXPIRE_MINUTES
        value: "10"
      - key: PASSWORD_RESET_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: VENDOR_COMMISSION_RATE
        value: "0.10"
      - key: VENDOR_WITHDRAWAL_MINIMUM
        value: "20.0"
      - key: ASSISTANT_PROVIDER
        value: gemini
      - key: ASSISTANT_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta

databases:
  - name: odos-postgres
    plan: free
    databaseName: odos_mobile
    user: odos_user
